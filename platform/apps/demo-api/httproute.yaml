apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-api
  namespace: demo-api
  labels:
    app.kubernetes.io/name: demo-api
spec:
  parentRefs:
    - name: public
      namespace: gateway-system
  hostnames:
    - demo-api.localtest.me
  rules:
    - backendRefs:
        - name: demo-api
          port: 80

