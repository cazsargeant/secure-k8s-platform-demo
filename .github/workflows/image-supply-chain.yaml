name: image-supply-chain

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write

jobs:
  build-scan-sign:
    name: build, scan, sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tag
        id: image
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY}/demo-api"
          image_name="$(echo "$image_name" | tr '[:upper:]' '[:lower:]')"
          tag="${GITHUB_REF_NAME}-${GITHUB_SHA::12}"
          tag="${tag//\//-}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$image_name:$tag" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: apps/demo-api
          push: true
          tags: ${{ steps.image.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: anchore/scan-action@v7
        with:
          image: ${{ steps.image.outputs.image }}
          fail-build: true
          severity-cutoff: high
      - uses: sigstore/cosign-installer@v4
      - name: Sign image
        run: cosign sign --yes "${{ steps.image.outputs.image }}"
      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${{ steps.image.outputs.image }}"
      - uses: actions/upload-artifact@v5
        with:
          name: sbom
          path: sbom.spdx.json
