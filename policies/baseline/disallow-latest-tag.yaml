apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest image tag
    policies.kyverno.io/category: Supply Chain Security
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-explicit-non-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Container images must use explicit tags and must not use latest."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('^[^:]+$', element.image) }}"
                    operator: Equals
                    value: true
                  - key: "{{ ends_with(element.image, ':latest') }}"
                    operator: Equals
                    value: true

